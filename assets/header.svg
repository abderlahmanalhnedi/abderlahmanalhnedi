<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#050b12"/>
      <stop offset="0.45" stop-color="#07131f"/>
      <stop offset="1" stop-color="#03080e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#00a8ff"/>
      <stop offset="1" stop-color="#3f8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)" stroke="#1f6feb" stroke-width="2"/>
  <g opacity=".35">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#0f2a44"/>
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" stroke="#0b2136"/>
  </g>

  <!-- server rack -->
  <g transform="translate(28 30)">
    <rect width="150" height="238" rx="12" fill="#07111d" stroke="#175b93"/>
    <g fill="#0b1d2e" stroke="#1b4f75">
      <rect x="18" y="18" width="114" height="35" rx="5"/>
      <rect x="18" y="65" width="114" height="35" rx="5"/>
      <rect x="18" y="112" width="114" height="35" rx="5"/>
      <rect x="18" y="159" width="114" height="35" rx="5"/>
    </g>
    <g fill="#00a8ff">
      <circle cx="34" cy="35" r="3"/><circle cx="47" cy="35" r="3"/>
      <circle cx="34" cy="82" r="3"/><circle cx="47" cy="82" r="3"/>
      <circle cx="34" cy="129" r="3"/><circle cx="47" cy="129" r="3"/>
      <circle cx="34" cy="176" r="3"/><circle cx="47" cy="176" r="3"/>
    </g>
    <path d="M92 35h26M92 82h26M92 129h26M92 176h26" stroke="#2f81f7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- cloud security -->
  <g transform="translate(1000 58)" fill="none" stroke="#1fa8ff" stroke-width="4" filter="url(#glow)">
    <path d="M36 80c-20 0-36-13-36-31s14-31 32-31c6-18 22-30 42-30 25 0 45 18 48 42 18 2 32 16 32 34 0 19-15 34-35 34H36z"/>
    <rect x="53" y="89" width="52" height="45" rx="7"/>
    <path d="M66 89V77c0-10 7-18 13-18s13 8 13 18v12"/>
    <circle cx="79" cy="110" r="4" fill="#1fa8ff"/>
  </g>

  <text x="600" y="48" text-anchor="middle" fill="#58b8ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">IT INFRASTRUCTURE  •  AUTOMATION  •  SECURITY</text>
  <text x="600" y="105" text-anchor="middle" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="2">ABDELRAHMAN <tspan fill="#3f8cff">AL HNEDI</tspan></text>
  <line x1="320" x2="880" y1="128" y2="128" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <g transform="translate(315 164)"><rect x="-64" y="-19" width="128" height="38" rx="9" fill="#0d1825" stroke="#265c87"/><text y="5" fill="#dbeafe">Microsoft 365</text></g>
    <g transform="translate(455 164)"><rect x="-56" y="-19" width="112" height="38" rx="9" fill="#0d1825" stroke="#265c87"/><text y="5" fill="#dbeafe">Entra ID</text></g>
    <g transform="translate(580 164)"><rect x="-48" y="-19" width="96" height="38" rx="9" fill="#0d1825" stroke="#265c87"/><text y="5" fill="#dbeafe">Intune</text></g>
    <g transform="translate(705 164)"><rect x="-56" y="-19" width="112" height="38" rx="9" fill="#0d1825" stroke="#265c87"/><text y="5" fill="#dbeafe">PowerShell</text></g>
    <g transform="translate(847 164)"><rect x="-64" y="-19" width="128" height="38" rx="9" fill="#0d1825" stroke="#265c87"/><text y="5" fill="#dbeafe">Automation</text></g>
  </g>

  <text x="600" y="228" text-anchor="middle" fill="#c9d1d9" font-family="Courier New, monospace" font-size="18">&gt; Building tools that solve <tspan fill="#58b8ff">real IT problems</tspan>_</text>
  <circle cx="600" cy="260" r="3" fill="#58b8ff"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>