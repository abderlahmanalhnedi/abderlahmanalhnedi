<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250">
<rect width="960" height="250" rx="18" fill="#0d1117" stroke="#30363d"/>
<rect x="0" y="0" width="960" height="38" rx="18" fill="#161b22"/>
<rect x="0" y="20" width="960" height="18" fill="#161b22"/>
<circle cx="22" cy="19" r="6" fill="#ff5f56"/>
<circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="19" r="6" fill="#27c93f"/>
<text x="480" y="24" text-anchor="middle" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="12">abdul@github ~ ops-console</text>

<g font-family="Courier New,monospace" font-size="15">
  <text x="28" y="72" fill="#58a6ff">$</text>
  <text x="48" y="72" fill="#f0f6fc">start-it-automation --profile production</text>

  <g opacity="0">
    <text x="28" y="105" fill="#39d353">[OK]</text>
    <text x="78" y="105" fill="#c9d1d9">Microsoft 365 services connected</text>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.1;0.8;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <text x="28" y="135" fill="#58a6ff">[SYNC]</text>
    <text x="92" y="135" fill="#c9d1d9">Entra identity workflow running</text>
    <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.18;0.3;0.85;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <text x="28" y="165" fill="#d2a8ff">[SCAN]</text>
    <text x="92" y="165" fill="#c9d1d9">Intune policy analysis in progress</text>
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.35;0.45;0.55;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <text x="28" y="195" fill="#ffa657">[AUTO]</text>
    <text x="92" y="195" fill="#c9d1d9">PowerShell task completed successfully</text>
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.5;0.6;0.7;0.8;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <text x="28" y="226" fill="#58a6ff">&gt;</text>
  <rect x="48" y="212" width="10" height="17" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x="0" y="42" width="960" height="2" fill="#2f81f7" opacity=".5">
  <animate attributeName="y" values="42;246;42" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".05;.35;.05" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>